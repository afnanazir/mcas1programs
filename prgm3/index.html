<html>
<head>
    <title>Frame navigation</title>
</head>
<body>
    <h1 align="center">KMEA ENGINEERING COLLEGE</h1>
    <hr>
    <!--NAvigation Frame-->
    <table width="100%" border="1">
        <tr>
            <td width="25%" valign="top">
                <h3>Navigation</h3>
                <a href="home.html" target="contentFrame">Home</a><br><br>
                <a href="about.html" target="contentFrame">About Us</a><br><br>
                <a href="courses.html" target="contentFrame">Courses</a><br><br>
            </td>
            <!--Mixed Frame-->
            <td width="75%">
                <iframe
                 name="contentFrame" 
                 src="home.html" 
                 width="100%" 
                 height="350">
                </iframe>
            </td>
        </tr>
    </table>
    <hr>
    <!--Floating Frame-->
    <h2 align="center">College Website</h2>
    <p align="center">
        The following is a floating frame displaying the college website.</p>
        <iframe 
        src="https://www.kmeacollege.ac.in/" 
        width="100%" height="400" ></iframe>
</body>
</html>
